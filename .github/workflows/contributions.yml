name: GitHub Contributions Heatmap

on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest changes
        run: git pull --rebase origin main
      - name: Update contributions heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import datetime
          import math
          import urllib.request

          owner = os.environ.get("GITHUB_REPOSITORY_OWNER")
          if not owner:
              repo = os.environ.get("GITHUB_REPOSITORY", "")
              owner = repo.split("/")[0] if "/" in repo else ""
          if not owner:
              owner = "23skdu"
          token = os.environ.get("GITHUB_TOKEN", "")

          today = datetime.date.today()
          start = today - datetime.timedelta(days=364)
          from_str = start.strftime("%Y-%m-%dT00:00:00Z")
          to_str = today.strftime("%Y-%m-%dT23:59:59Z")

          grid = []  # (week_index, day_index, date_str, count)
          total = 0

          # Primary: GitHub GraphQL
          try:
              query = (
                  "query($login:String!,$from:DateTime!,$to:DateTime!){"
                  "user(login:$login){contributionsCollection(from:$from,to:$to){"
                  "contributionCalendar{totalContributions weeks{contributionDays{date contributionCount color}}}}}}"
              )
              payload = json.dumps(
                  {"query": query, "variables": {"login": owner, "from": from_str, "to": to_str}}
              ).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "contrib-heatmap",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              cal = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
              total = cal["totalContributions"]
              wi = 0
              for w in cal["weeks"]:
                  for di, d in enumerate(w["contributionDays"]):
                      grid.append((wi, di, d["date"], int(d["contributionCount"])))
                  wi += 1
          except Exception as exc:
              print("GraphQL failed:", exc)
              grid = []
              total = 0
              # Fallback: scrape public contributions page
              try:
                  url = f"https://github.com/users/{owner}/contributions"
                  req = urllib.request.Request(url, headers={"User-Agent": "contrib-heatmap"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      html = resp.read().decode("utf-8", "replace")
                  scraped = []
                  for m in re.finditer(r'data-date="(\d{4}-\d{2}-\d{2})"[^>]*data-level="(\d+)"', html):
                      scraped.append((m.group(1), int(m.group(2))))
                  if not scraped:
                      for m in re.finditer(r'data-level="(\d+)"[^>]*data-date="(\d{4}-\d{2}-\d{2})"', html):
                          scraped.append((m.group(2), int(m.group(1))))
                  if scraped:
                      scraped.sort()
                      first_date = datetime.date.fromisoformat(scraped[0][0])
                      offset = (first_date.weekday() + 1) % 7
                      week_start = first_date - datetime.timedelta(days=offset)
                      for date_str, lvl in scraped:
                          d = datetime.date.fromisoformat(date_str)
                          idx = (d - week_start).days
                          wi = idx // 7
                          di = idx % 7
                          # scale level to a pseudo-count for height/color
                          grid.append((wi, di, date_str, lvl * 25))
                      total = sum(c for _, _, _, c in grid)
              except Exception as exc2:
                  print("Scrape failed:", exc2)
                  grid = []
                  total = 0

          # Rendering parameters (compact)
          cube_w = 12
          cube_h = 3
          cube_z = 3
          max_stack = 30
          ox = 60
          oy = 90


          def stack_count(count):
              if count <= 0:
                  return 0
              n = (count + 9) // 10
              if n < 1:
                  n = 1
              if n > max_stack:
                  n = max_stack
              return n


          def color_for_n(n):
              if n < 1:
                  return None
              palette = [
                  "#fff176", "#ffd54f", "#ffca28",
                  "#ff9800", "#f4511e", "#d32f2f",
              ]
              idx = n - 1
              if idx >= len(palette):
                  idx = len(palette) - 1
              return palette[idx]


          # Month boundaries for red side markers
          from collections import defaultdict

          week_day_dates = defaultdict(dict)
          for wi, di, date_str, count in grid:
              week_day_dates[wi][di] = date_str

          month_boundaries = []
          prev_month = None
          for wi in sorted(week_day_dates):
              if 0 in week_day_dates[wi]:
                  dstr = week_day_dates[wi][0]
              else:
                  dstr = next(iter(week_day_dates[wi].values()))
              dt = datetime.date.fromisoformat(dstr)
              mabbr = dt.strftime("%b")
              if mabbr != prev_month:
                  month_boundaries.append((wi, mabbr))
                  prev_month = mabbr

          polys = []  # (sortkey_tuple, svg_line)
          flame_lines = []
          fireball_lines = []
          max_count = 0
          max_date = None
          for _wi, _di, _date_str, _count in grid:
              if _count > max_count:
                  max_count = _count
                  max_date = _date_str
          for wi, di, date_str, count in grid:
              n = stack_count(count)
              is_max_day = (date_str == max_date and count == max_count and max_count > 0)
              if n == 0:
                  continue
              c = color_for_n(n)
              if c is None:
                  continue
              bx = ox + (wi - di) * cube_w
              by = oy + (wi + di) * cube_h
              for k in range(n):
                  z = k * cube_z
                  top = [
                      (bx, by - z),
                      (bx + cube_w, by - cube_h - z),
                      (bx + 2 * cube_w, by - z),
                      (bx + cube_w, by + cube_h - z),
                  ]
                  left = [
                      (bx, by - z),
                      (bx + cube_w, by + cube_h - z),
                      (bx + cube_w, by + cube_h - z + cube_z),
                      (bx, by - z + cube_z),
                  ]
                  right = [
                      (bx + 2 * cube_w, by - z),
                      (bx + cube_w, by + cube_h - z),
                      (bx + cube_w, by + cube_h - z + cube_z),
                      (bx + 2 * cube_w, by - z + cube_z),
                  ]

                  def poly(pts, fill):
                      pts_str = " ".join(f"{x},{y}" for x, y in pts)
                      return f'<polygon points="{pts_str}" fill="{fill}" stroke="#164020" stroke-width="0.2"/>'

                  polys.append(((wi + di, wi, k, 0), poly(left, c)))
                  polys.append(((wi + di, wi, k, 1), poly(right, c)))
                  polys.append(((wi + di, wi, k, 2), poly(top, c)))

              if count > 100:
                  cx = bx + cube_w
                  if is_max_day:
                      rad_outer, rad_mid, rad_inner = 30, 22, 14
                      ray_inner, ray_outer = 18, 32
                      step = 20
                      offset = 18
                  elif count > 150:
                      rad_outer, rad_mid, rad_inner = 24, 18, 11
                      ray_inner, ray_outer = 16, 26
                      step = 30
                      offset = 14
                  else:
                      rad_outer, rad_mid, rad_inner = 18, 13, 8
                      ray_inner, ray_outer = 10, 18
                      step = 45
                      offset = 10
                  cy = by - n * cube_z - cube_h - offset
                  fireball_lines.append(f'<circle cx="{cx}" cy="{cy}" r="{rad_outer}" fill="#ff8c00" opacity="0.35"/>')
                  fireball_lines.append(f'<circle cx="{cx}" cy="{cy}" r="{rad_mid}" fill="#ffcc00" opacity="0.6"/>')
                  fireball_lines.append(f'<circle cx="{cx}" cy="{cy}" r="{rad_inner}" fill="#fff176"/>')
                  for _ang in range(0, 360, step):
                      _x1 = cx + ray_inner * math.cos(math.radians(_ang))
                      _y1 = cy + ray_inner * math.sin(math.radians(_ang))
                      _x2 = cx + ray_outer * math.cos(math.radians(_ang))
                      _y2 = cy + ray_outer * math.sin(math.radians(_ang))
                      fireball_lines.append(
                          f'<line x1="{_x1:.1f}" y1="{_y1:.1f}" '
                          f'x2="{_x2:.1f}" y2="{_y2:.1f}" '
                          f'stroke="#ffdd00" stroke-width="2"/>'
                      )

          polys.sort(key=lambda p: (p[0][0], p[0][1], p[0][2], p[0][3]))

          svg_lines = []
          svg_lines.append('<svg xmlns="http://www.w3.org/2000/svg"')
          svg_lines.append('  viewBox="0 0 740 280"')
          svg_lines.append('  width="100%" height="auto"')
          svg_lines.append('  preserveAspectRatio="xMidYMid meet"')
          svg_lines.append('  role="img" aria-label="GitHub contributions heatmap">')
          svg_lines.append('<rect width="100%" height="100%" fill="#0d1117"/>')
          svg_lines.append('<defs>')
          svg_lines.append('  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">')
          svg_lines.append('    <feGaussianBlur stdDeviation="2.5" result="blur"/>')
          svg_lines.append('    <feMerge>')
          svg_lines.append('      <feMergeNode in="blur"/>')
          svg_lines.append('      <feMergeNode in="SourceGraphic"/>')
          svg_lines.append('    </feMerge>')
          svg_lines.append('  </filter>')
          svg_lines.append('</defs>')
          label = "GitHub Contributions · past year · " + str(total) + " total"
          svg_lines.append(
              f'<text x="8" y="14" fill="#c9d1d9" font-size="10" '
              f'font-family="sans-serif">{label}</text>'
          )
          svg_lines.append('<g filter="url(#glow)">')
          for _, line in polys:
              svg_lines.append(line)
          svg_lines.append('</g>')

          # Red month divider lines on the side
          month_lines = []
          for wi, mabbr in month_boundaries:
              pts = []
              for di in range(7):
                  if di not in week_day_dates.get(wi, {}):
                      continue
                  bx = ox + (wi - di) * cube_w
                  by = oy + (wi + di) * cube_h
                  pts.append((bx + cube_w, by))
              if len(pts) >= 2:
                  pts_str = " ".join(f"{x},{y}" for x, y in pts)
                  month_lines.append(
                      f'<polyline points="{pts_str}" fill="none" '
                      f'stroke="#f85149" stroke-width="1.2"/>'
                  )
              if pts:
                  lx, ly = pts[0]
                  month_lines.append(
                      f'<text x="{lx - 3}" y="{ly - 2}" '
                      f'fill="#f85149" font-size="11" font-weight="bold" '
                      f'text-anchor="end" font-family="sans-serif">{mabbr}</text>'
                  )

          for line in month_lines:
              svg_lines.append(line)

          svg_lines.append('<g filter="url(#glow)">')
          for line in flame_lines:
              svg_lines.append(line)
          for line in fireball_lines:
              svg_lines.append(line)

          svg_lines.append('</g>')
          # Legend box at bottom left
          svg_lines.append(
              '<rect x="4" y="184" width="320" height="72" '
              'fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4"/>'
          )
          svg_lines.append(
              '<text x="10" y="198" fill="#c9d1d9" font-size="9" '
              'font-weight="bold" font-family="sans-serif">Legend</text>'
          )
          svg_lines.append(
              '<text x="10" y="212" fill="#c9d1d9" font-size="9" '
              'font-family="sans-serif">Each level = 10 commits</text>'
          )
          svg_lines.append(
              '<text x="10" y="226" fill="#ff8c00" font-size="9" '
              'font-family="sans-serif">&gt; 100 commits: fireball</text>'
          )
          svg_lines.append(
              '<text x="10" y="240" fill="#ff8c00" font-size="9" '
              'font-family="sans-serif">&gt; 150 commits: larger fireball</text>'
          )
          svg_lines.append(
              f'<text x="10" y="254" fill="#ffdd00" font-size="9" '
              f'font-family="sans-serif">Blaze  {max_date} ({max_count} commits) - most commits single day</text>'
          )
          svg_lines.append("</svg>")

          svg_text = "\n".join(svg_lines)

          # Also write standalone SVG file
          with open("contributions.svg", "w", encoding="utf-8") as f:
              f.write(svg_text + "\n")

          # Update README: remove existing block, prepend at top
          path = "README.md"
          with open(path, encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r"<!-- contributions:start -->.*?<!-- contributions:end -->\n*", "", content, flags=re.S)

          block = (
              "<!-- contributions:start -->\n"
              "<!-- heatmap:start -->\n"
              "<!-- github-contributions:start -->\n"
              "![GitHub Contributions Heatmap](contributions.svg)\n"
              "<!-- github-contributions:end -->\n"
              "<!-- heatmap:end -->\n"
              "<!-- contributions:end -->"
          )

          about_marker = "[About Me](https://23skdu.github.io/)"
          if about_marker in content:
              content = content.replace(about_marker, about_marker + "\n\n" + block, 1)
          else:
              content = block + "\n\n" + content.lstrip("\n")

          new_content = content

          with open(path, "w", encoding="utf-8") as f:
              f.write(new_content)


          print(f"Contributions: total={total}, days={len(grid)}, polygons={len(polys)}")
          PY
      - name: Commit heatmap update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md contributions.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub contributions heatmap [skip ci]"
            for _ in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              sleep $((RANDOM % 15 + 5))
            done
          fi
