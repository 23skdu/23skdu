name: Seattle Weather

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update Seattle temperature badge
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          url = (
              "https://api.open-meteo.com/v1/forecast"
              "?latitude=47.6062"
              "&longitude=-122.3321"
              "&current=temperature_2m"
              "&temperature_unit=fahrenheit"
          )
          with urllib.request.urlopen(url, timeout=30) as response:
              data = json.load(response)
          import time
          temp = round(data["current"]["temperature_2m"])
          badge_url = (
              f"https://img.shields.io/badge/Seattle-{temp}_F-blue"
              f"?t={int(time.time())}"
          )
          with open("README.md") as f:
              content = f.read()
          content = re.sub(
              r"https://img\.shields\.io/badge/Seattle-[^)]*",
              badge_url,
              content,
          )
          with open("README.md", "w") as f:
              f.write(content)
          print(f"Seattle current temp: {temp} F")
          PY
      - name: Commit badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Seattle weather badge [skip ci]"
            git push
          fi
