name: Seattle Weather

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Seattle weather diagram
        run: |
          set -u

          temp=""
          condition=""
          icon="🌡️"
          forecast_file="$(mktemp)"
          : > "$forecast_file"

          weather_meta() {
            case "$1" in
              0) W_ICON="☀️"; W_COND="Clear sky" ;;
              1|2|3) W_ICON="🌤️"; W_COND="Partly cloudy" ;;
              45|48) W_ICON="🌫️"; W_COND="Fog" ;;
              51|53|55|56|57) W_ICON="🌦️"; W_COND="Drizzle" ;;
              61|63|65|66|67) W_ICON="🌧️"; W_COND="Rain" ;;
              71|73|75|77) W_ICON="🌨️"; W_COND="Snow" ;;
              80|81|82) W_ICON="🌦️"; W_COND="Rain showers" ;;
              85|86) W_ICON="🌨️"; W_COND="Snow showers" ;;
              95|96|99) W_ICON="⛈️"; W_COND="Thunderstorm" ;;
              *) W_ICON="🌡️"; W_COND="Unknown" ;;
            esac
          }

          icon_for_condition() {
            lc="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            case "$lc" in
              *sun*|*clear*) printf '☀️' ;;
              *cloud*) printf '☁️' ;;
              *rain*|*drizzle*) printf '🌧️' ;;
              *snow*) printf '🌨️' ;;
              *thunder*) printf '⛈️' ;;
              *fog*|*mist*) printf '🌫️' ;;
              *) printf '🌡️' ;;
            esac
          }

          # Primary source: Open-Meteo
          weather_url="https://api.open-meteo.com/v1/forecast?latitude=47.6062"
          weather_url="$weather_url&longitude=-122.3321"
          weather_url="$weather_url&current=temperature_2m,weather_code"
          weather_url="$weather_url&daily=temperature_2m_max,temperature_2m_min,weather_code"
          weather_url="$weather_url&forecast_days=4"
          weather_url="$weather_url&timezone=America%2FLos_Angeles"
          weather_url="$weather_url&temperature_unit=fahrenheit"
          primary="$(curl -fsS --max-time 15 "$weather_url" 2>/dev/null || true)"
          if [ -n "$primary" ]; then
            t="$(printf '%s' "$primary" | jq -r '.current.temperature_2m // empty' 2>/dev/null || true)"
            code="$(printf '%s' "$primary" | jq -r '.current.weather_code // empty' 2>/dev/null || true)"
            if [ -n "$t" ]; then
              temp="$(printf '%.0f' "$t" 2>/dev/null || printf '%s' "$t")"
              weather_meta "$code"
              condition="$W_COND"
              icon="$W_ICON"
              printf '%s' "$primary" | jq -r '
                .daily.time as $dates |
                .daily.temperature_2m_max as $maxs |
                .daily.temperature_2m_min as $mins |
                .daily.weather_code as $codes |
                [range(1;4)] | .[] |
                "\($dates[.])\t\($maxs[.])\t\($mins[.])\t\($codes[.])"
              ' 2>/dev/null | while IFS="$(printf '\t')" read -r d hi lo c; do
                [ -z "$d" ] && continue
                day="$(date -d "$d" +%a 2>/dev/null || printf '%s' "$d")"
                hi_r="$(printf '%.0f' "$hi" 2>/dev/null || printf '%s' "$hi")"
                lo_r="$(printf '%.0f' "$lo" 2>/dev/null || printf '%s' "$lo")"
                weather_meta "$c"
                printf '%s %s/%s F %s %s\n' \
                  "$day" "$hi_r" "$lo_r" "$W_ICON" "$W_COND" >> "$forecast_file"
              done
            fi
          fi

          # Fallback source: wttr.in
          if [ -z "$temp" ]; then
            fallback="$(curl -fsS --max-time 15 \
              "https://wttr.in/Seattle?format=j1" 2>/dev/null || true)"
            if [ -n "$fallback" ]; then
              t="$(printf '%s' "$fallback" | jq -r '.current_condition[0].temp_F // empty' 2>/dev/null || true)"
              weather_desc_filter='.current_condition[0].weatherDesc[0].value // empty'
              ctext="$(printf '%s' "$fallback" | jq -r "$weather_desc_filter" 2>/dev/null || true)"
              if [ -n "$t" ]; then
                temp="$(printf '%.0f' "$t" 2>/dev/null || printf '%s' "$t")"
                condition="${ctext:-Unknown}"
                icon="$(icon_for_condition "$condition")"
                printf '%s' "$fallback" | jq -r '
                  .weather[] |
                  "\(.date)\t\(.maxtempF)\t\(.mintempF)\t\(.hourly[4].weatherDesc[0].value)"
                ' 2>/dev/null | while IFS="$(printf '\t')" read -r d hi lo fc; do
                  [ -z "$d" ] && continue
                  day="$(date -d "$d" +%a 2>/dev/null || printf '%s' "$d")"
                  hi_r="$(printf '%.0f' "$hi" 2>/dev/null || printf '%s' "$hi")"
                  lo_r="$(printf '%.0f' "$lo" 2>/dev/null || printf '%s' "$lo")"
                  ficon="$(icon_for_condition "$fc")"
                  printf '%s %s/%s F %s %s\n' \
                    "$day" "$hi_r" "$lo_r" "$ficon" "${fc:-Unknown}" >> "$forecast_file"
                done
              fi
            fi
          fi

          # Final fallback
          if [ -z "$temp" ]; then
            temp="N/A"
            condition="Unavailable"
            icon="❓"
          fi

          # Sanitize for Mermaid
          condition="$(printf '%s' "$condition" | tr -d '"`')"

          TEMP="$temp" CONDITION="$condition" ICON="$icon" \
            FORECAST_FILE="$forecast_file" python3 - <<'PY'
          import os
          import re

          temp = os.environ["TEMP"]
          condition = os.environ["CONDITION"]
          icon = os.environ["ICON"]
          forecast_path = os.environ["FORECAST_FILE"]

          forecast_lines = []
          try:
              with open(forecast_path, encoding="utf-8") as handle:
                  forecast_lines = [
                      line.rstrip("\n") for line in handle if line.strip()
                  ]
          except OSError:
              forecast_lines = []

          forecast_lines = forecast_lines[:3]
          lines = ["```mermaid", "flowchart TB"]
          lines.append('    subgraph top[" "]')
          lines.append('        T["🌲 Seattle Weather\\n47.6062 N, 122.3321 W"]')
          lines.append("    end")
          lines.append('    subgraph bottom[" "]')
          lines.append("        direction LR")
          lines.append(f'        N["{icon} Now: {temp} F\\n{condition}"]')
          for index, entry in enumerate(forecast_lines, start=1):
              safe = entry.replace('"', "")
              lines.append(f'        D{index}["{safe}"]')
          if forecast_lines:
              lines.append("        N --> " + " --> ".join(
                  f"D{index}" for index in range(1, len(forecast_lines) + 1)
              ))
          lines.append("    end")
          lines.append("    top --> bottom")
          lines.append("    style top fill:none,stroke:none")
          lines.append("    style bottom fill:none,stroke:none")
          lines.append("```")
          diagram = "\n".join(lines) + "\n"

          path = "README.md"
          with open(path, encoding="utf-8") as handle:
              content = handle.read()

          pattern = re.compile(r"<!-- weather:start -->.*?<!-- weather:end -->", re.S)
          replacement = "<!-- weather:start -->\n" + diagram + "<!-- weather:end -->"
          content, count = pattern.subn(lambda _match: replacement, content)
          if count == 0:
              content = content.rstrip() + "\n\n" + replacement + "\n"

          with open(path, "w", encoding="utf-8") as handle:
              handle.write(content)

          print(f"Seattle weather: {temp} F, {condition}")
          print(f"Forecast days: {len(forecast_lines)}")
          PY
      - name: Commit diagram update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Seattle weather diagram [skip ci]"
            git push
          fi
